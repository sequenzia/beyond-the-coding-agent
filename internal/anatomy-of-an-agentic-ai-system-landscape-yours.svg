<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7a8a96"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#ffffff"/>

  <text x="960" y="52" text-anchor="middle" font-size="36" font-weight="700" fill="#1a1a1a">Anatomy of an Agentic AI System: every box is yours</text>

  <!-- Platform -->
  <rect x="40" y="80" width="1840" height="970" rx="22" fill="#eef2f6" stroke="#9fb3c2" stroke-width="2"/>
  <text x="72" y="128" font-size="34" font-weight="700" fill="#1f3a4d">Platform</text>
  <text x="1848" y="126" text-anchor="end" font-size="24" fill="#1f3a4d">Runs, secures, and improves the agent</text>

  <!-- Per-run services -->
  <text x="72" y="178" font-size="24" font-weight="700" fill="#1f3a4d">Per-run services</text>
  <text x="290" y="178" font-size="22" fill="#1f3a4d">Every run draws on these</text>

  <rect x="72" y="195" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="362" y="237" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Identity and access</text>
  <text x="362" y="271" text-anchor="middle" font-size="20" fill="#3a3a3a">Auth, permissions, scoped credentials</text>

  <rect x="670" y="195" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="960" y="237" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Security</text>
  <text x="960" y="271" text-anchor="middle" font-size="20" fill="#3a3a3a">Injection defense, sandboxing, secrets</text>

  <rect x="1268" y="195" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="1558" y="237" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Data and knowledge</text>
  <text x="1558" y="271" text-anchor="middle" font-size="20" fill="#3a3a3a">RAG, vector stores, connectors</text>

  <!-- One run -->
  <rect x="72" y="320" width="1776" height="550" rx="18" fill="#f4f7fa" stroke="#8fa3b3" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="100" y="366" font-size="30" font-weight="700" fill="#1f3a4d">One run</text>
  <text x="1820" y="364" text-anchor="end" font-size="22" fill="#1f3a4d">Repeats for each goal</text>

  <!-- Goal -->
  <rect x="100" y="577" width="320" height="120" rx="14" fill="#f9e6e0" stroke="#b5452c" stroke-width="2"/>
  <text x="260" y="625" text-anchor="middle" font-size="28" font-weight="700" fill="#8a2f1a">Goal</text>
  <text x="260" y="660" text-anchor="middle" font-size="18" fill="#8a2f1a">From user, trigger, or schedule</text>

  <line x1="420" y1="637" x2="474" y2="637" stroke="#7a8a96" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Agent -->
  <rect x="480" y="390" width="1030" height="450" rx="18" fill="#ede8e0" stroke="#b8ad9c" stroke-width="2"/>
  <text x="510" y="436" font-size="30" font-weight="700" fill="#1f3a4d">Agent</text>
  <text x="1480" y="434" text-anchor="end" font-size="22" fill="#1f3a4d">Model + harness</text>

  <!-- Model -->
  <rect x="510" y="577" width="250" height="120" rx="14" fill="#e3f0e9" stroke="#2e7d5b" stroke-width="2"/>
  <text x="635" y="625" text-anchor="middle" font-size="28" font-weight="700" fill="#1f5f43">Model</text>
  <text x="635" y="660" text-anchor="middle" font-size="18" fill="#1f5f43">Decides what to do</text>

  <text x="795" y="651" text-anchor="middle" font-size="40" fill="#555555">+</text>

  <!-- Harness -->
  <rect x="830" y="460" width="650" height="354" rx="16" fill="#ece9fb" stroke="#6c5fc7" stroke-width="2"/>
  <text x="855" y="500" font-size="28" font-weight="700" fill="#3f33a8">Harness</text>
  <text x="855" y="528" font-size="19" fill="#4a3fb8">Carries state across turns</text>

  <!-- Harness grid: 2 columns x 3 rows -->
  <rect x="847" y="546" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="997" y="577" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Orchestration</text>
  <text x="997" y="606" text-anchor="middle" font-size="18" fill="#3a3a3a">Loop, hooks, workflows</text>

  <rect x="1163" y="546" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="1313" y="577" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Tools</text>
  <text x="1313" y="606" text-anchor="middle" font-size="18" fill="#3a3a3a">Files, shell, web, MCP</text>

  <rect x="847" y="636" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="997" y="667" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Context and memory</text>
  <text x="997" y="696" text-anchor="middle" font-size="18" fill="#3a3a3a">History, working memory</text>

  <rect x="1163" y="636" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="1313" y="667" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Guardrails</text>
  <text x="1313" y="696" text-anchor="middle" font-size="18" fill="#3a3a3a">Limits on actions</text>

  <rect x="847" y="726" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="997" y="757" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Instructions</text>
  <text x="997" y="786" text-anchor="middle" font-size="18" fill="#3a3a3a">System prompt, config</text>

  <rect x="1163" y="726" width="300" height="78" rx="12" fill="#faf9f6" stroke="#cfcad9" stroke-width="2"/>
  <text x="1313" y="757" text-anchor="middle" font-size="24" font-weight="700" fill="#1a1a1a">Verification</text>
  <text x="1313" y="786" text-anchor="middle" font-size="18" fill="#3a3a3a">Tests, checks, self-review</text>

  <line x1="1510" y1="637" x2="1564" y2="637" stroke="#7a8a96" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- Stopping condition -->
  <rect x="1570" y="582" width="278" height="110" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="1709" y="628" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">Run until a stopping</text>
  <text x="1709" y="658" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a1a">condition is met</text>

  <!-- Across runs -->
  <text x="72" y="912" font-size="24" font-weight="700" fill="#1f3a4d">Across runs</text>
  <text x="228" y="912" font-size="22" fill="#1f3a4d">Learn from and control many runs over time</text>

  <rect x="72" y="928" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="362" y="970" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Observability</text>
  <text x="362" y="1004" text-anchor="middle" font-size="20" fill="#3a3a3a">Logs, traces, metrics, cost</text>

  <rect x="670" y="928" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="960" y="970" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Evaluations</text>
  <text x="960" y="1004" text-anchor="middle" font-size="20" fill="#3a3a3a">Offline evals, regression suites, A/B</text>

  <rect x="1268" y="928" width="580" height="100" rx="14" fill="#faf9f6" stroke="#c9c4b8" stroke-width="2"/>
  <text x="1558" y="970" text-anchor="middle" font-size="28" font-weight="700" fill="#1a1a1a">Governance</text>
  <text x="1558" y="1004" text-anchor="middle" font-size="20" fill="#3a3a3a">Policies, audit trails, approvals</text>

  <!-- "yours" badges for slide 19 -->
  <rect x="580" y="183.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="611.0" y="199.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1178" y="183.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
