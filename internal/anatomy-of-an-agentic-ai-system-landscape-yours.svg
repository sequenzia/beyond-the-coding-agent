  <rect x="1178" y="916.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1209.0" y="932.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1776" y="916.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1807.0" y="932.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1085" y="536.0" width="52" height="20" rx="10.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1111.0" y="550.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1401" y="536.0" width="52" height="20" rx="10.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1427.0" y="550.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1085" y="626.0" width="52" height="20" rx="10.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1111.0" y="640.0" text-anchor="middle" font-size="12" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="1401" y="626.0" width="52" height="20" rx="10.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
