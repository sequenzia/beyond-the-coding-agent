  <rect x="1776" y="570.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1807.0" y="586.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours</text>
  <rect x="618" y="565.0" width="132" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="684.0" y="581.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours to select</text>
  <rect x="1408" y="448.0" width="62" height="24" rx="12.0" fill="#ffe8a3" stroke="#b5842c" stroke-width="1.5"/>
  <text x="1439.0" y="464.8" text-anchor="middle" font-size="14" font-weight="700" fill="#5a3d00">yours</text>
