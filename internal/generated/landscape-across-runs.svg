<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#adaca9"/>
    </marker>
  </defs>

  <rect width="1920" height="1080" fill="#14161c"/>

  <g id="title" opacity="0.3">
    <text x="960" y="52" text-anchor="middle" font-size="40" font-weight="700" fill="#fffcf5">Anatomy of an Agentic AI System</text>
  </g>

  <g id="platform" opacity="0.3">
    <rect x="40" y="80" width="1840" height="970" rx="16" fill="none" stroke="#4c4d50" stroke-width="2"/>
    <text x="72" y="128" font-size="40" font-weight="700" fill="#fffcf5">Platform</text>
    <text x="1848" y="126" text-anchor="end" font-size="24" fill="#adaca9">Runs, secures, and improves the agent</text>
  </g>

  <g id="per-run" opacity="0.3">
    <text x="72" y="178" font-size="32" font-weight="700" fill="#fffcf5">Per-run services</text>
    <text x="350" y="178" font-size="24" fill="#adaca9">Every run draws on these</text>

    <rect id="box-identity" x="72" y="195" width="580" height="100" rx="10" fill="#303236"/>
    <text x="362" y="237" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Identity and access</text>
    <text x="362" y="271" text-anchor="middle" font-size="24" fill="#adaca9">Auth, permissions, scoped credentials</text>

    <rect id="box-security" x="670" y="195" width="580" height="100" rx="10" fill="#303236"/>
    <text x="960" y="237" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Security</text>
    <text x="960" y="271" text-anchor="middle" font-size="24" fill="#adaca9">Injection defense, sandboxing, secrets</text>

    <rect id="box-data" x="1268" y="195" width="580" height="100" rx="10" fill="#303236"/>
    <text x="1558" y="237" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Data and knowledge</text>
    <text x="1558" y="271" text-anchor="middle" font-size="24" fill="#adaca9">RAG, vector stores, connectors</text>
  </g>

  <g id="one-run" opacity="0.3">
    <rect x="72" y="320" width="1776" height="558" rx="16" fill="none" stroke="#4c4d50" stroke-width="2" stroke-dasharray="12 8"/>
    <text x="100" y="366" font-size="40" font-weight="700" fill="#fffcf5">One run</text>
    <text x="1820" y="364" text-anchor="end" font-size="24" fill="#adaca9">Repeats for each goal</text>
  </g>

  <g id="goal" opacity="0.3">
    <rect id="box-goal" x="100" y="578" width="300" height="140" rx="10" fill="none" stroke="#adaca9" stroke-width="4"/>
    <text x="250" y="626" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Goal</text>
    <text x="250" y="660" text-anchor="middle" font-size="24" fill="#adaca9">From user, trigger,</text>
    <text x="250" y="690" text-anchor="middle" font-size="24" fill="#adaca9">or schedule</text>
  </g>

  <g id="arrows" opacity="0.3">
    <line x1="400" y1="648" x2="446" y2="648" stroke="#adaca9" stroke-width="4" marker-end="url(#arrow)"/>
    <line x1="1500" y1="648" x2="1546" y2="648" stroke="#adaca9" stroke-width="4" marker-end="url(#arrow)"/>
  </g>

  <g id="agent" opacity="0.3">
    <rect x="450" y="390" width="1050" height="472" rx="16" fill="none" stroke="#4c4d50" stroke-width="2"/>
    <text x="480" y="436" font-size="40" font-weight="700" fill="#fffcf5">Agent</text>
    <text x="1470" y="434" text-anchor="end" font-size="24" fill="#adaca9">Model + harness</text>
  </g>

  <g id="model" opacity="0.3">
    <rect id="box-model" x="475" y="578" width="210" height="140" rx="10" fill="#13223f" stroke="#1064f8" stroke-width="4"/>
    <text x="580" y="626" text-anchor="middle" font-size="32" font-weight="700" fill="#1064f8">Model</text>
    <text x="580" y="660" text-anchor="middle" font-size="24" fill="#adaca9">Decides</text>
    <text x="580" y="690" text-anchor="middle" font-size="24" fill="#adaca9">what to do</text>
  </g>

  <g id="plus" opacity="0.3">
    <text x="715" y="668" text-anchor="middle" font-size="56" fill="#adaca9">+</text>
  </g>

  <g id="harness" opacity="0.3">
    <rect id="box-harness" x="745" y="446" width="730" height="404" rx="16" fill="#2b1b2c" stroke="#f948be" stroke-width="4"/>
    <text x="762" y="488" font-size="40" font-weight="700" fill="#f948be">Harness</text>
    <text x="762" y="520" font-size="24" fill="#adaca9">Carries state across turns</text>

    <rect id="box-orchestration" x="762" y="540" width="340" height="90" rx="10" fill="#303236"/>
    <text x="932" y="578" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Orchestration</text>
    <text x="932" y="610" text-anchor="middle" font-size="24" fill="#adaca9">Loop, hooks, workflows</text>

    <rect id="box-tools" x="1118" y="540" width="340" height="90" rx="10" fill="#303236"/>
    <text x="1288" y="578" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Tools</text>
    <text x="1288" y="610" text-anchor="middle" font-size="24" fill="#adaca9">Files, shell, web, MCP</text>

    <rect id="box-context" x="762" y="642" width="340" height="90" rx="10" fill="#303236"/>
    <text x="932" y="680" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Context and memory</text>
    <text x="932" y="712" text-anchor="middle" font-size="24" fill="#adaca9">History, working memory</text>

    <rect id="box-guardrails" x="1118" y="642" width="340" height="90" rx="10" fill="#303236"/>
    <text x="1288" y="680" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Guardrails</text>
    <text x="1288" y="712" text-anchor="middle" font-size="24" fill="#adaca9">Limits on actions</text>

    <rect id="box-instructions" x="762" y="744" width="340" height="90" rx="10" fill="#303236"/>
    <text x="932" y="782" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Instructions</text>
    <text x="932" y="814" text-anchor="middle" font-size="24" fill="#adaca9">System prompt, config</text>

    <rect id="box-verification" x="1118" y="744" width="340" height="90" rx="10" fill="#303236"/>
    <text x="1288" y="782" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Verification</text>
    <text x="1288" y="814" text-anchor="middle" font-size="24" fill="#adaca9">Tests, checks, self-review</text>
  </g>

  <g id="stop" opacity="0.3">
    <rect id="box-stop" x="1550" y="578" width="298" height="140" rx="10" fill="#303236"/>
    <text x="1699" y="620" text-anchor="middle" font-size="28" font-weight="700" fill="#fffcf5">Run until</text>
    <text x="1699" y="654" text-anchor="middle" font-size="28" font-weight="700" fill="#fffcf5">a stopping</text>
    <text x="1699" y="688" text-anchor="middle" font-size="28" font-weight="700" fill="#fffcf5">condition is met</text>
  </g>

  <g id="across-runs">
    <text x="72" y="912" font-size="32" font-weight="700" fill="#fffcf5">Across runs</text>
    <text x="290" y="912" font-size="24" fill="#adaca9">Learn from and control many runs over time</text>

    <rect id="box-observability" x="72" y="928" width="580" height="100" rx="10" fill="#303236"/>
    <text x="362" y="970" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Observability</text>
    <text x="362" y="1004" text-anchor="middle" font-size="24" fill="#adaca9">Logs, traces, metrics, cost</text>

    <rect id="box-evaluations" x="670" y="928" width="580" height="100" rx="10" fill="#303236"/>
    <text x="960" y="970" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Evaluations</text>
    <text x="960" y="1004" text-anchor="middle" font-size="24" fill="#adaca9">Offline evals, regression suites, A/B</text>

    <rect id="box-governance" x="1268" y="928" width="580" height="100" rx="10" fill="#303236"/>
    <text x="1558" y="970" text-anchor="middle" font-size="32" font-weight="700" fill="#fffcf5">Governance</text>
    <text x="1558" y="1004" text-anchor="middle" font-size="24" fill="#adaca9">Policies, audit trails, approvals</text>
  </g>
</svg>
